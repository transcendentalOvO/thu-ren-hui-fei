<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="清华人会飞 - Flappy Bird 风格的清华大学校徽小游戏。校徽躲避水管,满20分夜访二校门,速度越来越快!" />
<meta name="theme-color" content="#241040" />
<title>清华人会飞 · 新雅人会飞</title>
<link rel="icon" href="tsinghua_logo.svg" type="image/svg+xml" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:
    radial-gradient(130% 100% at 50% 0%, #241040 0%, #3d1c63 46%, #54267f 100%);
    -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  #stage { position:relative; }
  canvas { display:block; border-radius:16px; box-shadow:0 24px 70px rgba(10,2,25,.6), 0 0 0 2px rgba(246,187,96,.28);
           touch-action:none; user-select:none; -webkit-user-select:none; background:#c9c0ea; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
<script>
/* ============================================================
   清华人会飞 v3
   - 手机全屏适配 / 碰撞=视觉圆环 / 大间隙
   - 满20分 → 夜幕降临: 星空月亮 + 二校门剪影, 柱子与校徽发光
   - 恒定弹跳 + 速度持续提升(有上限, 理论上可一直玩)
   ============================================================ */
(function(){
'use strict';

/* ---------- 基础 ---------- */
const W=420, H=640;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

/* ---------- 高清渲染 ---------- */
let R=2;
function applyResolution(){
  R=Math.max(1, Math.min(2.5, (window.devicePixelRatio||1)));   // 上限2.5: 保清晰且省帧
  canvas.width=Math.round(W*R);
  canvas.height=Math.round(H*R);
  ctx.setTransform(R,0,0,R,0,0);
}
applyResolution();

/* 自适应缩放: 精确适配手机/电脑, 绝不缩小过度 */
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H)*0.985;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',function(){ fit(); applyResolution(); });
window.addEventListener('orientationchange',function(){ setTimeout(function(){ fit(); applyResolution(); },120); });
fit(); applyResolution();

/* 校徽图片 / 玩家头像球 */
const logo=new Image();
logo.src='tsinghua_logo.svg';
const avatar=new Image();
avatar.src='avatar_ball.png';
function ballImage(){
  if(avatar.complete && avatar.naturalWidth>0) return avatar;
  return logo;
}

/* ---------- 常量 ---------- */
const GRAVITY=1720, FLAP_BASE=540, MAX_FALL=840;
const GROUND_H=92, GROUND_Y=H-GROUND_H;
const BX=126, R_BIRD=28;
const HIT_R=26;                       // 判定半径 = 视觉半径的 9/10 (更宽容一点)
const PIPE_W=68, PIPE_GAP0=226, PIPE_GAP_MIN=170, PIPE_SPEED0=150, PIPE_SPEED_MAX=330;
const NIGHT_SCORE=20;                 // 满20分进入夜间

/* ---------- 状态 ---------- */
let state='menu';                 // menu | play | over
let birdY=300, vy=0, angle=0, bob=0;
let score=0, flash=0;
let pipes=[], dist=0, groundX=0;
let clouds=[], parts=[];
let deadT=0, newBest=false, muted=false;
let night=false, nightAmt=0;   // 夜间开关 / 渐变进度(仅背景变化, 无字幕无弹窗)
let mode='thu';                 // 'thu' 清华人会飞 | 'xinya' 新雅人会飞
let bestThu=+(localStorage.getItem('thu_best')||0);
let bestXy =+(localStorage.getItem('xinya_best')||0);
let best=bestThu, history=[];
try{ history=JSON.parse(localStorage.getItem('thu_hist')||'[]'); }catch(e){ history=[]; }
function applyMode(m){
  mode = (m==='xinya') ? 'xinya' : 'thu';
  if(mode==='xinya'){ best=bestXy; try{ history=JSON.parse(localStorage.getItem('xinya_hist')||'[]'); }catch(e){ history=[]; } }
  else { best=bestThu; try{ history=JSON.parse(localStorage.getItem('thu_hist')||'[]'); }catch(e){ history=[]; } }
}
function modeTitle(){ return mode==='xinya' ? '新雅人会飞' : '清华人会飞'; }
if(localStorage.getItem('thu_mute')==='1') muted=true;

/* 星星(夜间) */
let stars=[];
(function(){ for(let i=0;i<80;i++){ stars.push({x:Math.random()*W, y:Math.random()*GROUND_Y*.62, r:.6+Math.random()*1.5, ph:Math.random()*7}); } })();

/* ---------- 音频 ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol){
  if(muted) return; const a=ac(); if(!a) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||.15,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function sfxFlap(){ tone(300,640,.13,'triangle',.11); }
function sfxPoint(){ tone(880,880,.08,'sine',.12); setTimeout(function(){tone(1318,1318,.15,'sine',.10);},70); }
function sfxHit(){ tone(210,55,.38,'sawtooth',.20); }
function sfxNew(){ [660,880,1108,1318].forEach(function(f,i){ setTimeout(function(){tone(f,f,.18,'triangle',.12);},i*90); }); }

/* ---------- 音效按钮 ---------- */
const muteRect={x:W-48,y:10,w:38,h:38};

/* ---------- 难度: 间隙有下限, 速度有上限 ---------- */
function pipeGap(){ return Math.max(PIPE_GAP_MIN, PIPE_GAP0 - 8*Math.floor(score/4)); }
function pipeSpeed(){ return Math.min(PIPE_SPEED_MAX, PIPE_SPEED0 + score*4.2); }

function spawnPipe(){
  const gap=pipeGap();
  const margin=88;
  const cy= margin + gap/2 + Math.random()*(GROUND_Y-gap-2*margin);
  pipes.push({x:W+50, cy:cy, gap:gap, speed:pipeSpeed(), passed:false});
}
function resetPipes(){
  pipes=[]; const gap=pipeGap();
  const cs=[ [W+250,H*.40], [W+490,H*.58], [W+730,H*.35] ];
  cs.forEach(function(c){ pipes.push({x:c[0], cy:c[1], gap:gap, speed:pipeSpeed(), passed:false}); });
}

/* ---------- 粒子 ---------- */
function burst(x,y,n,cols){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=50+Math.random()*260;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,life:.35+Math.random()*.4,t:0,
                r:1.5+Math.random()*3, col:cols[i%cols.length]});
  }
}

/* ---------- 工具 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function text(str,x,y,size,color,align,bold){
  ctx.font=(bold?'700 ':'600 ')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillStyle=color; ctx.fillText(str,x,y);
}
function outlineText(str,x,y,size,color,line,align,bold){
  ctx.font=(bold?'800 ':'700 ')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/8); ctx.strokeStyle=line; ctx.lineJoin='round';
  ctx.strokeText(str,x,y); ctx.fillStyle=color; ctx.fillText(str,x,y);
}

/* ---------- 游戏控制 ---------- */
function flap(){ vy=-FLAP_BASE; sfxFlap(); }
function startGame(m){
  applyMode(m);
  score=0; birdY=300; vy=0; angle=0; flash=0; newBest=false; bob=0;
  night=false; nightAmt=0;
  resetPipes(); parts=[]; state='play'; deadT=0;
}
function enterNight(){ night=true; }
function gameOver(){
  state='over'; deadT=0; sfxHit();
  burst(BX,birdY,24,['#F6BB60','#ffffff','#d9a6f2']);
  try{
    history.unshift({s:score,t:Date.now()}); history=history.slice(0,8);
    localStorage.setItem(mode==='xinya'?'xinya_hist':'thu_hist', JSON.stringify(history));
    if(score>best){
      best=score; newBest=true;
      if(mode==='xinya') bestXy=score; else bestThu=score;
      localStorage.setItem(mode==='xinya'?'xinya_best':'thu_best', best);
      setTimeout(sfxNew,150);
    }
  }catch(e){}
}

/* ---------- 输入 ---------- */
const cardThu={x:60,y:70,w:300,h:128};
const cardXy ={x:60,y:216,w:300,h:128};
function cardAt(x,y){
  function inR(r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
  if(inR(cardThu)) return 'thu';
  if(inR(cardXy)) return 'xinya';
  return null;
}
function handleDown(x,y){
  if(x>=muteRect.x&&x<=muteRect.x+muteRect.w&&y>=muteRect.y&&y<=muteRect.y+muteRect.h){
    muted=!muted; localStorage.setItem('thu_mute',muted?'1':'0'); return;
  }
  if(state==='menu'){
    const m=cardAt(x,y);
    if(m) startGame(m);          // 点卡片选模式开玩
    return;
  }
  if(state==='play'){ flap(); return; }
  if(state==='over'){
    if(deadT<=0.55) return;
    const sy=newBest?418:384;    // 「换个模式」小按钮
    if(x>=W/2-95&&x<=W/2+95&&y>=sy-11&&y<=sy+11){ state='menu'; return; }
    startGame(mode);             // 再飞一次(同模式)
  }
}
canvas.addEventListener('pointerdown',function(e){
  ac();
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  handleDown(x,y);
});
canvas.addEventListener('contextmenu',function(e){ e.preventDefault(); });
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault(); ac();
    if(state==='menu') startGame(mode);      // 空格默认进入当前高亮模式
    else handleDown(-1,-1);
  }
});

/* ---------- 物理(250Hz 子步) ---------- */
let last=performance.now(), acc=0;
const STEP=1/240;
function tick(dt){
  if(state==='play'){
    vy=Math.min(MAX_FALL, vy+GRAVITY*dt);
    birdY+=vy*dt;
    if(birdY-R_BIRD<2){ birdY=R_BIRD+2; if(vy<0)vy*=-0.35; }
    const sp=pipeSpeed();
    for(let i=0;i<pipes.length;i++){
      const p=pipes[i];
      p.x-=p.speed*dt;
      if(!p.passed && p.x+PIPE_W<BX-HIT_R){
        p.passed=true; score++; flash=1; sfxPoint();
        burst(BX-4,birdY-R_BIRD-6,9,['#F6BB60','#ffffff']);
        if(!night && score>=NIGHT_SCORE) enterNight();      // 满20 → 入夜
      }
    }
    if(pipes.length&&pipes[0].x<-PIPE_W-70) pipes.shift();
    const lastP=pipes[pipes.length-1];
    if(lastP && lastP.x < W-225) spawnPipe();
    dist+=sp*dt; groundX=dist;
    if(vy<-120 && Math.random()<0.2) parts.push({x:BX+6+Math.random()*10-R_BIRD/2,y:birdY+R_BIRD*.42,vx:-50-Math.random()*50,vy:40+Math.random()*40,life:.3+Math.random()*.12,t:0,r:1.6+Math.random()*2.2,col:Math.random()<.5?'#F6BB60':'#ffffff'});
    // 碰撞: 判定半径≈视觉圆环, 且计入管口盖的加宽(盖沿碰到也算死)
    const by=birdY;
    if(birdY+R_BIRD>=GROUND_Y){ birdY=GROUND_Y-R_BIRD; gameOver(); return; }
    for(let i=0;i<pipes.length;i++){
      const p=pipes[i];
      const xOverlap = BX+HIT_R > p.x-7 && BX-HIT_R < p.x+PIPE_W+7;   // 含盖沿
      if(xOverlap){
        const top=p.cy-p.gap/2, bot=p.cy+p.gap/2;
        if(by-HIT_R<top || by+HIT_R>bot){ gameOver(); return; }
      }
    }
    // 旋转: 清华=随速度翘头/俯冲; 新雅=圆球顺时针滚动(角速度=水平速度/半径, 越玩滚越快)
    if(mode==='xinya'){
      angle += dt*(pipeSpeed()/R_BIRD)*1.18;
    } else {
      const target = vy<0 ? -0.44 : Math.min(1.35,(vy/MAX_FALL)*1.55);
      angle += (target-angle)*Math.min(1, dt*9);
    }
  } else if(state==='over'){
    deadT+=dt;
    vy=Math.min(MAX_FALL, vy+GRAVITY*dt*0.82);
    if(birdY<GROUND_Y-R_BIRD){ birdY+=vy*dt; angle+=dt*6.5; if(angle>1.5)angle=1.5; }
    else { birdY=GROUND_Y-R_BIRD; angle=1.5; }
  } else {
    bob=Math.sin(performance.now()/430)*7;
  }
  /* 夜间渐变(纯背景过渡) */
  nightAmt+=(night?1:-1)*dt*0.9;
  if(nightAmt<0) nightAmt=0; if(nightAmt>1) nightAmt=1;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=230*dt;
  }
  clouds.forEach(function(c){ c.x-=c.spd*dt; });
  clouds=clouds.filter(function(c){return c.x>-160;});
  if(clouds.length<5&&Math.random()<0.06) clouds.push({x:W+60,y:34+Math.random()*220,s:.6+Math.random()*1.2,a:.45+Math.random()*.4,spd:6+Math.random()*8});
  if(flash>0) flash-=dt*1.5;
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  acc+=dt;
  while(acc>=STEP){ tick(STEP); acc-=STEP; }
  draw();
  requestAnimationFrame(frame);
}

/* ============ 绘制 ============ */
/* 单一场景渲染: 颜色按 nightAmt 插值, 夜间装饰(星/月/门/辉光)按透明度淡入
   —— 绝不双份绘制, 不用昂贵的 shadowBlur */

function mixc(a,b,i,t){ return Math.round(a[i]+(b[i]-a[i])*t); }
function C3(a,b,t){ return 'rgb('+mixc(a,b,0,t)+','+mixc(a,b,1,t)+','+mixc(a,b,2,t)+')'; }
function C4(a,b,t){ return 'rgba('+mixc(a,b,0,t)+','+mixc(a,b,1,t)+','+mixc(a,b,2,t)+','+(a[3]+(b[3]-a[3])*t).toFixed(3)+')'; }

function drawSky(){
  const t=nightAmt;
  const D=[[174,147,226],[206,198,242],[234,228,248],[246,236,216],[247,221,180]];
  const N=[[7,11,38],[19,27,66],[46,44,94],[78,60,118],[95,70,128]];
  const g=ctx.createLinearGradient(0,0,0,H);
  const ps=[0,.33,.65,.86,1];
  for(let i=0;i<5;i++) g.addColorStop(ps[i],C3(D[i],N[i],t));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 太阳光晕(白天)→ 减弱
  if(t<1){
    ctx.globalAlpha=1-t;
    let sun=ctx.createRadialGradient(W*.78,120,8,W*.78,120,170);
    sun.addColorStop(0,'rgba(255,240,200,.95)'); sun.addColorStop(.35,'rgba(255,244,220,.5)'); sun.addColorStop(1,'rgba(255,244,220,0)');
    ctx.fillStyle=sun; ctx.fillRect(W*.78-170,120-170,340,340);
    sun=ctx.createRadialGradient(60,60,6,60,60,130);
    sun.addColorStop(0,'rgba(255,255,255,.8)'); sun.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sun; ctx.fillRect(-70,-70,260,260);
    ctx.globalAlpha=1;
  }
  // 远山(颜色随夜变深)
  drawHillsC(dist*0.05,  [122,90,158,.13],[86,66,150,.30], 26,.006);
  drawHillsC(dist*0.12+99,[148,90,170,.10],[72,56,132,.22], 20,.009);
  // 星光(淡入)
  if(t>0.02){
    const tnow=performance.now()/1000;
    ctx.save();
    stars.forEach(function(s){
      const a=(.35+.6*Math.abs(Math.sin(tnow*1.6+s.ph)))*t;
      ctx.globalAlpha=a; ctx.fillStyle=s.r>1.3?'#e8ecff':'#c3c9ff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    });
    ctx.restore(); ctx.globalAlpha=1;
    // 月亮
    ctx.save(); ctx.globalAlpha=t;
    const mx=W*.80, my=96;
    let mg=ctx.createRadialGradient(mx,my,10,mx,my,120);
    mg.addColorStop(0,'rgba(210,220,255,.9)'); mg.addColorStop(.25,'rgba(190,200,255,.35)'); mg.addColorStop(1,'rgba(190,200,255,0)');
    ctx.fillStyle=mg; ctx.fillRect(mx-120,my-120,240,240);
    ctx.fillStyle='#f4f1ff';
    ctx.beginPath(); ctx.arc(mx,my,30,0,7); ctx.fill();
    ctx.fillStyle='rgba(200,205,240,.55)';
    ctx.beginPath(); ctx.arc(mx-9,my-6,6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+8,my+10,4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+12,my-12,3,0,7); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function drawHillsC(off,cd,cn,amp,f){
  ctx.fillStyle=C4(cd,cn,nightAmt); ctx.beginPath();
  ctx.moveTo(-10,GROUND_Y+40);
  for(let x=-10;x<=W+10;x+=10){
    const wave=Math.sin((x+off)*f)*amp*.6 + Math.sin((x+off)*f*2.7+2)*amp*.3;
    ctx.lineTo(x, GROUND_Y - H*.24 - wave);
  }
  ctx.lineTo(W+10,GROUND_Y+40);
  ctx.closePath(); ctx.fill();
}
/* --- 二校门剪影(夜, 随夜色淡入) --- */
function drawGate(){
  if(nightAmt<=0.02) return;
  ctx.save(); ctx.globalAlpha=Math.min(1,nightAmt*1.6);
  const cx=W/2, base=GROUND_Y+4;
  const w=300, L=cx-w/2, R=cx+w/2;
  // 门后冷光
  const glow=ctx.createRadialGradient(cx,base-140,20,cx,base-140,230);
  glow.addColorStop(0,'rgba(150,140,255,.16)'); glow.addColorStop(1,'rgba(150,140,255,0)');
  ctx.fillStyle=glow; ctx.fillRect(cx-230,base-370,460,400);
  const stone='#2b3270', stoneHi='#3a4386';
  const topY=base-202;
  // 顶部檐
  ctx.fillStyle='#39408a'; ctx.fillRect(L-8,topY,w+16,16);
  ctx.fillStyle='rgba(168,160,245,.9)'; ctx.fillRect(L-8,topY,w+16,2);
  ctx.fillStyle='rgba(20,22,60,.9)'; ctx.fillRect(L-8,topY+14,w+16,2);
  // 匾额带(到底部与墙体无缝衔接)
  ctx.fillStyle=stone; ctx.fillRect(L,topY+16,w,36);
  ctx.fillStyle='#454d96'; rr(cx-56,topY+22,112,26,6); ctx.fill();
  ctx.strokeStyle='rgba(170,160,245,.6)'; ctx.lineWidth=1.5; rr(cx-56,topY+22,112,26,6); ctx.stroke();
  ctx.fillStyle='#f2d9a0'; ctx.font='700 17px "FZKai-Z03","KaiTi","STKaiti",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('清华园',cx,topY+36);
  // 拱门区(三个拱洞, 拱顶恰好抵到匾带下沿)
  const spring=base-104;
  ctx.fillStyle=stone;
  ctx.beginPath();
  ctx.rect(L,topY+52,w,base-topY-52);
  addArch(L+24, 62);        // 左小拱 (r31 → 拱顶 base-135)
  addArch(L+24+62+20, 88);  // 中拱   (r44 → 拱顶 base-148)
  addArch(L+24+62+20+88+20, 62); // 右小拱
  ctx.fill('evenodd');
  // 石料拱线
  ctx.strokeStyle='rgba(150,142,235,.30)'; ctx.lineWidth=1;
  [[L+24+62+20,88],[L+24,62],[L+24+62+20+88+20,62]].forEach(function(a){
    const x0=a[0],r=a[1]/2;
    ctx.beginPath(); ctx.arc(x0+r,spring,r,Math.PI,0); ctx.stroke();
  });
  // 匾带下沿细影
  ctx.fillStyle='rgba(12,12,45,.35)'; ctx.fillRect(L,base-150,w,2);
  function addArch(x0,wO){
    ctx.moveTo(x0,base); ctx.lineTo(x0,spring);
    ctx.arc(x0+wO/2,spring,wO/2,Math.PI,0);
    ctx.lineTo(x0+wO,base);
    ctx.closePath();
  }
  ctx.restore();
}
/* --- 云 --- */
function drawClouds(){
  const t=nightAmt, col=C3([255,255,255],[124,112,190],t);
  clouds.forEach(function(c){
    ctx.save(); ctx.globalAlpha=c.a*(1-0.35*t);
    ctx.translate(c.x,c.y); const r=c.s*20;
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(0,r*.28,r*1.55,r*.55,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*.8,-r*.05,r*.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*.2,-r*.42,r*.78,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(r*.55,-r*.18,r*.68,0,7); ctx.fill();
    ctx.restore();
  });
}
/* --- 管道: 颜色随昼夜插值, 辉光用分层描边(不用昂贵的 shadowBlur) --- */
function drawPipes(){
  const t=nightAmt;
  for(let i=0;i<pipes.length;i++){
    const p=pipes[i], top=p.cy-p.gap/2, bot=p.cy+p.gap/2, capH=30;
    const D=[[177,123,221],[138,60,192],[106,34,158],[85,24,131]];
    const N=[[156,124,236],[126,92,220],[84,52,176],[58,30,140]];
    const body=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    const ps2=[0,.32,.75,1];
    for(let k=0;k<4;k++) body.addColorStop(ps2[k],C3(D[k],N[k],t));
    ctx.fillStyle=body; ctx.fillRect(p.x,-12,PIPE_W,top+capH+12);
    ctx.fillStyle=body; ctx.fillRect(p.x,bot-12,PIPE_W,H-bot+12);
    paintCap(p.x-5,top,capH,t);
    paintCap(p.x-5,bot-capH,capH,t);
    // 接缝(白天金 / 夜晚青), 分层"辉光"
    const seam=C3([246,187,96],[150,240,255],t);
    if(t>0.02){ ctx.globalAlpha=t*.25; ctx.fillStyle=seam;
      ctx.fillRect(p.x-8,top+capH-9,PIPE_W+16,9); ctx.fillRect(p.x-8,bot-6,PIPE_W+16,9); }
    ctx.globalAlpha=1;
    ctx.fillStyle=seam;
    ctx.fillRect(p.x-5,top+capH-5,PIPE_W+10,2.5);
    ctx.fillRect(p.x-5,bot-2.5,PIPE_W+10,2.5);
    // 左高光 / 右阴影
    ctx.fillStyle='rgba(255,255,255,'+(0.18+0.17*t).toFixed(3)+')';
    ctx.fillRect(p.x+8,0,6,Math.max(0,top+capH));
    ctx.fillRect(p.x+8,bot-capH,6,GROUND_Y-bot+capH);
    ctx.fillStyle=C4([40,8,70,.28],[6,3,32,.45],t);
    ctx.fillRect(p.x+PIPE_W-9,0,9,Math.max(0,top+capH));
    ctx.fillRect(p.x+PIPE_W-9,bot-capH,9,GROUND_Y-bot+capH);
  }
}
function paintCap(x,y,capH,t){
  const D=[[212,172,238],[174,103,221],[124,45,180]];
  const N=[[244,234,255],[204,170,250],[128,80,214]];
  const cg=ctx.createLinearGradient(0,y,0,y+capH);
  const ps3=[0,.3,1];
  for(let k=0;k<3;k++) cg.addColorStop(ps3[k],C3(D[k],N[k],t));
  rr(x,y,PIPE_W+10,capH,9);
  ctx.fillStyle=cg; ctx.fill();
  // 双层描边 = 廉价霓虹边
  ctx.lineJoin='round';
  ctx.strokeStyle=C4([64,16,100,.35],[140,190,255,.45],t);
  ctx.lineWidth=6; rr(x,y,PIPE_W+10,capH,9); ctx.stroke();
  ctx.strokeStyle=C4([64,16,100,.6],[228,220,255,.95],t);
  ctx.lineWidth=2; rr(x,y,PIPE_W+10,capH,9); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.30)'; rr(x+6,y+4,PIPE_W-8,capH*.3,4); ctx.fill();
}
/* --- 地面 --- */
function drawGround(){
  const t=nightAmt, gy=GROUND_Y;
  const D=[[109,49,159],[79,31,120],[46,17,73]];
  const N=[[56,46,106],[34,27,74],[13,10,38]];
  const g=ctx.createLinearGradient(0,gy,0,H);
  const ps4=[0,.28,1];
  for(let k=0;k<3;k++) g.addColorStop(ps4[k],C3(D[k],N[k],t));
  ctx.fillStyle=g; ctx.fillRect(0,gy,W,GROUND_H);
  ctx.fillStyle=C3([138,76,192],[74,63,134],t);
  for(let x=-4;x<W+10;x+=18){
    ctx.beginPath(); ctx.arc(x,gy+2,9,Math.PI,0); ctx.fill();
  }
  ctx.fillStyle=C3([246,227,168],[255,215,110],t); ctx.fillRect(0,gy-1,W,3);
  ctx.fillStyle='rgba(255,215,110,'+(0.65+0.05*t).toFixed(3)+')'; ctx.fillRect(0,gy+2,W,1.5);
  ctx.fillStyle='rgba(255,255,255,'+(0.045-0.015*t).toFixed(3)+')';
  const off=-(groundX%52);
  for(let x=off;x<W;x+=52) ctx.fillRect(x,gy+16,26,GROUND_H-16);
  ctx.fillStyle='rgba(0,0,0,.10)';
  ctx.fillRect(0,gy+22,W,2); ctx.fillRect(0,gy+58,W,2);
  ctx.fillStyle=C4([246,187,96,.30],[255,215,110,.16],t);
  [[31,38],[67,52],[143,42],[196,60],[258,36],[321,55],[382,44]].forEach(function(d){
    const xx=d[0]+Math.round(groundX*0.6)%13; ctx.fillRect(xx,gy+d[1],2.5,2.5);
  });
}
/* --- 校徽(球): 夜间更亮 --- */
function drawLogo(cx,cy,r,rot,nA,avatarOn){
  const glowUp = vy<0? Math.min(1,-vy/900):0;
  const halo = (nA*.62+glowUp*.4);
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot||0);
  if(halo>0.03){
    const gg=ctx.createRadialGradient(0,0,r*.35,0,0,r*2.0);
    gg.addColorStop(0,'rgba(255,'+(200+nA*55)+',140,'+(halo*.9)+')');
    gg.addColorStop(1,'rgba(255,214,120,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,r*2.1,0,7); ctx.fill();
  }
  ctx.save(); ctx.translate(3,6); ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.arc(0,0,r*1.16,0,7); ctx.fillStyle='#140a24'; ctx.fill(); ctx.restore();
  // 底环(夜间提亮)
  ctx.beginPath(); ctx.arc(0,0,r*1.12,0,7);
  const ring = nA>0.5 ? 'rgba(255,224,138,.99)' : '#e5b24a';
  ctx.fillStyle='rgba(255,255,255,'+(0.97-0.06*nA)+')'; ctx.fill();
  ctx.lineWidth=Math.max(2.2,r*.1); ctx.strokeStyle=ring; ctx.stroke();
  if(nA>0.5){ ctx.lineWidth=1; ctx.strokeStyle='rgba(255,245,220,.95)'; ctx.stroke(); }
  const img = avatarOn ? ballImage() : logo;
  if(img.complete&&img.naturalWidth>0){
    const d = img===avatar ? r*2.10 : r*2.16;   // 头像球贴纸全幅圆形
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r*1.05,0,7); ctx.clip();
    ctx.drawImage(img,-d/2,-d/2,d,d);
    if(img===logo && avatarOn && nA>0.4){ ctx.globalAlpha=(nA-0.4)*.5; ctx.fillStyle='#ffe9c0';
      ctx.beginPath(); ctx.arc(0,0,r*.9,0,7); ctx.fill(); ctx.globalAlpha=1; }
    ctx.restore();
  }else{
    ctx.beginPath(); ctx.arc(0,0,r*.96,0,7);
    ctx.fillStyle='#920783'; ctx.fill();
    ctx.fillStyle='#F6BB60'; ctx.font='700 '+(r*.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('清华',0,-r*.1);
  }
  ctx.restore();
}
function drawBird(){ drawLogo(BX,birdY+bob,R_BIRD,angle,nightAmt,mode==='xinya'); }
function drawParticles(){
  parts.forEach(function(p){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function chip(x,y,txt,fill,txtCol,size){
  ctx.font='600 '+(size||12)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  const w=ctx.measureText(txt).width+22;
  ctx.fillStyle=fill; rr(x-w/2,y-11,w,22,(size||12)*1.3+6); ctx.fill();
  text(txt,x,y+1,txtCol||'#5b1f8f');
}
function drawHUD(){
  if(state!=='menu'){
    const line = nightAmt>0.5?'rgba(30,20,90,.95)':'rgba(70,18,115,.92)';
    outlineText(String(score),W/2,40,56,'#ffffff',line,'center',true);
  }
  ctx.fillStyle='rgba(255,255,255,.7)';
  rr(muteRect.x,muteRect.y,muteRect.w,muteRect.h,11); ctx.fill();
  ctx.strokeStyle='rgba(90,26,140,.25)'; ctx.lineWidth=1.5; rr(muteRect.x,muteRect.y,muteRect.w,muteRect.h,11); ctx.stroke();
  ctx.fillStyle='#4a176e'; ctx.font='600 19px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(muted?'🔇':'🔊',muteRect.x+muteRect.w/2,muteRect.y+muteRect.h/2+1);
  if(flash>0&&state!=='over'){
    ctx.globalAlpha=Math.min(1,flash); outlineText('+1',BX+44,birdY-52,30,'#F6BB60','rgba(70,18,115,.85)'); ctx.globalAlpha=1;
  }
}
function drawMenu(){
  // 背板
  ctx.fillStyle='rgba(255,255,255,.92)';
  rr(W/2-164,14,328,440,28); ctx.fill();
  ctx.strokeStyle='rgba(146,7,131,.18)'; ctx.lineWidth=2; rr(W/2-164,14,328,440,28); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1; rr(W/2-162,16,324,436,27); ctx.stroke();
  text('选择你的校徽 · 开始游戏',W/2,36,18,'#5b1f8f','center',true);
  text('两种模式 · 成绩分开记录 · 同样飞向二校门之夜',W/2,56,10.5,'rgba(90,26,140,.55)');
  // 模式卡片
  function card(r,ball,t,sub,bestVal,tc,bc,ac){
    rr(r.x,r.y,r.w,r.h,22);
    ctx.fillStyle=bc; ctx.fill();
    ctx.strokeStyle=tc; ctx.lineWidth=2; rr(r.x,r.y,r.w,r.h,22); ctx.stroke();
    drawLogo(r.x+52,r.y+r.h/2,27,0,0,ball);
    const tx=r.x+96;
    ctx.fillStyle=ac;
    ctx.font='800 26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(t,tx,r.y+42);
    ctx.font='600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle='rgba(60,40,90,.6)';
    ctx.fillText(sub,tx,r.y+70);
    ctx.font='700 14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle=ac;
    ctx.fillText('🏆 最佳 '+bestVal,tx,r.y+100);
    ctx.font='700 20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle=tc;
    ctx.fillText('▶',r.x+r.w-30,r.y+r.h/2+1);
  }
  card(cardThu,false,'清华人会飞','紫荆校徽 · 经典挑战',bestThu,
       'rgba(146,7,131,.55)','rgba(146,7,131,.06)','#6a1f96');
  card(cardXy,true,'新雅人会飞','红色头像 · 新雅之夜挑战',bestXy,
       'rgba(196,64,48,.6)','rgba(196,64,48,.07)','#b23a2e');
  // 玩法提示
  ctx.textAlign='center';
  text('点按 / 空格 起飞 · 穿过水管 +1 · 速度渐快',W/2,372,12.5,'rgba(90,26,140,.85)');
  text('满 20 分 → 背景悄然入夜 · 星空 & 二校门(无弹窗)',W/2,394,11.5,'rgba(90,26,140,.6)');
  text('云开雾散, 一路到天亮都可以飞 ~',W/2,420,10.5,'rgba(90,26,140,.42)');
}
function drawOver(){
  drawLogo(BX,birdY,R_BIRD,angle,nightAmt,mode==='xinya');
  if(deadT>0.45){
    ctx.fillStyle='rgba(18,10,40,.55)'; ctx.fillRect(0,0,W,H);
    const ny=newBest?36:0;
    const ph=newBest?282:246;
    ctx.fillStyle='rgba(255,255,255,.95)';
    rr(W/2-156,128,312,ph,26); ctx.fill();
    ctx.strokeStyle='rgba(246,187,96,.75)'; ctx.lineWidth=2.5; rr(W/2-156,128,312,ph,26); ctx.stroke();
    if(newBest){
      ctx.fillStyle='#F6BB60'; rr(W/2-88,146,176,32,16); ctx.fill();
      text('★ 新纪录! ★',W/2,162,'#5b1f8f',undefined,true);
    }
    outlineText('游戏结束',W/2,156+ny,32,'#5b1f8f','#fff',undefined,true);
    text('本局得分',W/2,186+ny,12,'rgba(90,26,140,.6)');
    outlineText(String(score),W/2,214+ny,42,'#920783','#ffffff');
    text('个人最佳  '+best,W/2,248+ny,13,'rgba(90,26,140,.75)');
    const by0=276+ny;
    const bg=ctx.createLinearGradient(0,by0,0,by0+48);
    bg.addColorStop(0,'#a53fd0'); bg.addColorStop(1,'#700ba3');
    ctx.fillStyle=bg; rr(W/2-105,by0,210,48,24); ctx.fill();
    ctx.strokeStyle='rgba(246,187,96,.75)'; ctx.lineWidth=2; rr(W/2-105,by0,210,48,24); ctx.stroke();
    text('再飞一次 ↑',W/2,by0+25,'#ffffff',undefined,true);
    const sy=newBest?418:384;
    ctx.fillStyle='rgba(255,255,255,.55)'; rr(W/2-95,sy-11,190,22,11); ctx.fill();
    ctx.strokeStyle='rgba(90,26,140,.3)'; ctx.lineWidth=1; rr(W/2-95,sy-11,190,22,11); ctx.stroke();
    text('⌂ 换个模式',W/2,sy,12,'rgba(90,26,140,.75)');
  }
}

/* ---------- 主绘制: 单一场景, 颜色按 nightAmt 连续渐变 ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  drawSky();                       // 含星/月/远山(按夜色淡入)
  drawGate();                      // 二校门(透明度淡入)
  drawClouds();
  if(state!=='menu') drawPipes();
  drawParticles();
  if(state!=='menu') drawBird();
  drawGround();
  drawHUD();
  if(state==='menu') drawMenu();
  if(state==='over') drawOver();
}

/* ---------- 自测钩子 ---------- */
window.__THU={ get:function(){return {state:state,birdY:birdY,vy:vy,score:score,fatigue:1,pipes:pipes.length,p0x:pipes.length?Math.round(pipes[0].x):-999,groundY:GROUND_Y,best:best,night:night,nA:Math.round(nightAmt*100)/100,mode:mode,nb:newBest,angle:Math.round(angle*100)/100};} };

requestAnimationFrame(function(now){ last=now; requestAnimationFrame(frame); });
})();
</script>
